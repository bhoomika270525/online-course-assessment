<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online Course{% endblock %}</title>
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-light bg-light">
    <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">OnlineCourse</a>
    <div>
        {% if user.is_authenticated %}
            <span class="mr-3">{{ user.first_name|default:user.username }}</span>
            <a href="{% url 'onlinecourse:logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'onlinecourse:login' %}">Login</a>
        {% endif %}
    </div>
</nav>
{% block content %}{% endblock %}
</body>
</html>
